# Add this location to the 3d.balancebey.com HTTPS server block.
# Real 404s avoid serving the SPA document for a missing AR asset.
location ^~ /models/ {
    types {
        model/gltf-binary glb;
        model/vnd.usdz+zip usdz;
        image/webp webp;
    }
    default_type application/octet-stream;
    try_files $uri =404;
}
